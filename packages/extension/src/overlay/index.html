<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PiX Recording</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .pix-rec {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 0 12px;
    background: rgba(0, 0, 0, 0.85);
    color: white;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    transition: background 120ms ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
  .pix-rec:hover {
    background: #d94021;
  }
  .pix-rec:active {
    background: #b53319;
  }
  .pix-rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3b30;
    flex-shrink: 0;
    animation: pix-rec-pulse 1.4s ease-in-out infinite;
  }
  .pix-rec:hover .pix-rec-dot {
    background: white;
    animation: none;
  }
  @keyframes pix-rec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="pix-rec" id="stop-btn" title="Click to stop recording" role="button" tabindex="0">
    <span class="pix-rec-dot"></span>
    <span>STOP</span>
  </div>
  <script src="./index.js" type="module"></script>
</body>
</html>
