<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PiX Recording</title>
<style>
  /* Persistent "red light" indicator. Injected as web_accessible_resource
     into every tab while the recorder is active. */
  body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
  }
  .pix-rec-light {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: rgba(0,0,0,0.85);
    color: white;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .pix-rec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3b30;
    animation: pix-rec-pulse 1.4s ease-in-out infinite;
  }
  @keyframes pix-rec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="pix-rec-light">
    <span class="pix-rec-dot"></span>
    <span>REC</span>
  </div>
  <script src="./index.js" type="module"></script>
</body>
</html>
