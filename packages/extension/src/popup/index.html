<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PiX Recorder</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    width: 280px;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    color: #1f2933;
  }
  h1 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px;
    color: #d94021;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #7b8794;
    margin-bottom: 12px;
  }
  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b5bfba;
  }
  .status.recording .dot {
    background: #ff3b30;
    animation: pix-pulse 1.4s ease-in-out infinite;
  }
  @keyframes pix-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .row {
    display: flex;
    gap: 8px;
  }
  button {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #e4e7eb;
    border-radius: 6px;
    background: white;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f5f7fa; }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button.primary:not(:disabled) {
    background: #d94021;
    color: white;
    border-color: #d94021;
  }
  code {
    font-family: 'SF Mono', Monaco, monospace;
    font-size: 10px;
    background: #f5f7fa;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .library-row {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #e4e7eb;
    text-align: center;
  }
  .library-link {
    display: inline-block;
    padding: 6px 12px;
    color: #1f2933;
    background: transparent;
    border: 1px solid #e4e7eb;
    border-radius: 6px;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .library-link:hover {
    background: #f5f7fa;
    border-color: #d94021;
    color: #d94021;
  }
</style>
</head>
<body>
  <h1>PiX Recorder</h1>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">Loading…</span></div>
  <div class="row">
    <button class="primary" id="start">Start recording</button>
    <button id="stop">Stop</button>
  </div>
  <div class="library-row">
    <button class="library-link" id="open-library">Open library ↗</button>
  </div>
  <script src="./index.js" type="module"></script>
</body>
</html>
