# Deploy PiX v3 (the @pix/editor web app) to GitHub Pages.
# Build output lives at packages/editor/dist/ since the monorepo migration.
# The legacy /pages/app-embed/ redirect for Casiopea embeds is part of the
# editor's public/ folder and gets copied automatically by Vite.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -w @pix/editor

      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/editor/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
